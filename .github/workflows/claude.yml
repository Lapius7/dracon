name: Claude

# Runs only when someone with write access mentions @claude in a comment.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 50
            --model claude-sonnet-5-5
            --effort medium
            --append-system-prompt "Never push directly to the repository's default branch (main or master). Make any change on a non-default branch (the pull request's branch, or a new claude/ branch) and leave merging to the user."
